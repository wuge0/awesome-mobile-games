        </div>
      </div>
      <div class="p-4 flex-1 flex flex-col">
        <div class="flex items-start justify-between gap-2 mb-1">
          <h3 class="font-bold text-base leading-tight">${escapeHtml(item.name)}</h3>
          <span class="text-xs px-2 py-0.5 rounded-full border shrink-0" style="border-color: var(--border); color: var(--text-muted);">${escapeHtml(item.category.split(' ')[1] || item.category)}</span>
        </div>
        <p class="text-sm mb-3 flex-1" style="color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">${escapeHtml(item.desc)}</p>
        <a href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener" class="text-sm font-semibold truncate">${escapeHtml(item.source_text)} ↗</a>
      </div>
    </article>
  `;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let currentCat = '全部';
let currentQuery = '';

function render() {
  const filtered = ITEMS.filter(item => {
    const catMatch = currentCat === '全部' || item.category === currentCat;
    const q = currentQuery.trim();
    const searchMatch = !q || item.search.includes(q) || item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.source_text.toLowerCase().includes(q) || item.category.toLowerCase().includes(q);
    return catMatch && searchMatch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
  } else {
    empty.classList.add('hidden');
    grid.innerHTML = filtered.map(cardHTML).join('');
  }

  // Update counts
  const byCat = {};
  ITEMS.forEach(i => { byCat[i.category] = (byCat[i.category] || 0) + 1; });
  document.getElementById('count-total').textContent = ITEMS.length;
  document.getElementById('count-browser').textContent = byCat['🌐 浏览器游戏'] || 0;
  document.getElementById('count-native').textContent = byCat['🖥️ 原生游戏'] || 0;
  document.getElementById('count-mobile').textContent = (byCat['📱 移动游戏'] || 0);
  document.getElementById('count-tools').textContent = (byCat['🧰 框架 · 引擎 · 库'] || 0) + (byCat['🗺️ 地图 · 插件 · 工具'] || 0) + (byCat['🤖 聊天机器人'] || 0) + (byCat['📦 仅源码项目'] || 0);

  observeImages();
}

function observeImages() {
  if (!window.IntersectionObserver) {
    document.querySelectorAll('img[data-src]').forEach(img => { img.src = img.dataset.src; });
    return;
  }
  const obs = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
        observer.unobserve(img);
      }
    });
  }, { rootMargin: '200px' });
  document.querySelectorAll('img[data-src]').forEach(img => obs.observe(img));
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  });
});

search.addEventListener('input', e => {
  currentQuery = e.target.value.toLowerCase();
  render();
});

// Theme toggle
const themeToggle = document.getElementById('themeToggle');
function applyTheme(dark) {
  if (dark) {
    document.documentElement.classList.add('dark');
    themeToggle.textContent = '☀️';
  } else {
    document.documentElement.classList.remove('dark');
    themeToggle.textContent = '🌙';
  }
}
applyTheme(localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches));
themeToggle.addEventListener('click', () => {
  const dark = !document.documentElement.classList.contains('dark');
  applyTheme(dark);
  localStorage.setItem('theme', dark ? 'dark' : 'light');
});

// Back to top
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  backToTop.classList.toggle('visible', window.scrollY > 400);
});
backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

// Init
ITEMS.forEach(i => i.search = (i.name + ' ' + i.desc + ' ' + i.source_text + ' ' + i.category + ' ' + i.subcategory).toLowerCase());
render();
</script>

</body>
</html>
